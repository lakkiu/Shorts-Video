<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <style>
      :root {
        --ground: #f6f2ea;
        --ink: #141414;
        --red: #cd2e3a;
        --blue: #0047a0;
        --font-display: "Montserrat";
        --font-body: "Inter";
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0; width: 1920px; height: 1080px; overflow: hidden;
        background: var(--ground);
      }
      #root { width: 100%; height: 100%; font-family: var(--font-display); }
      #bg { position: absolute; inset: 0; background: var(--ground); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15.5" data-width="1920" data-height="1080">
      <div id="bg"></div>
      <div id="intro" data-composition-id="intro" data-composition-src="compositions/intro.html"
        data-start="0" data-duration="3.5" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080"></div>
      <div id="visa" data-composition-id="visa" data-composition-src="compositions/visa.html"
        data-start="3.5" data-duration="4.5" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080"></div>
      <div id="prep" data-composition-id="prep" data-composition-src="compositions/prep.html"
        data-start="8" data-duration="4.5" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080"></div>
      <div id="outro" data-composition-id="outro" data-composition-src="compositions/outro.html"
        data-start="12.5" data-duration="3" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080"></div>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
