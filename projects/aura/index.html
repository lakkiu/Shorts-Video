<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/lib/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Mont"; font-weight: 900; src: url("assets/fonts/montserrat-latin-900-normal.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+2122, U+2212, U+FEFF; }
      @font-face { font-family: "Mont"; font-weight: 900; src: url("assets/fonts/montserrat-vietnamese-900-normal.woff2") format("woff2");
        unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; background: #000; }
      #cv { position: absolute; inset: 0; width: 1080px; height: 1920px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="30.3" data-width="1080" data-height="1920">
      <canvas id="cv" class="clip" data-start="0" data-duration="30.3" data-track-index="0" width="1080" height="1920"></canvas>
      <audio id="music" class="clip" src="assets/audio/phonk.wav" data-start="0" data-duration="30.3" data-track-index="1" data-volume="1"></audio>
    </div>

    <script>
      (function () {
        var D = 30.3, clock = { t: 0 }, sc = { render: null };
        window.__mono = sc;
        window.__hf = window.__hf || {};
        window.__hf.buildReady = window.__hf.buildReady || {};
        window.__hf.buildReady["main"] = new Promise(function (r) { sc.ready = r; });
        var tl = gsap.timeline({ paused: true });
        tl.to(clock, { t: D, duration: D, ease: "none", onUpdate: function () { if (sc.render) sc.render(clock.t); } }, 0);
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      })();
    </script>

    <script type="module">
      import { POSES, mixPose, figure, smooth, lerp, clamp01, hash, roundRect, stroke, circle } from "./assets/mono.js";
      await document.fonts.load("900 120px 'Mont'", "KỶ LUẬT ĐỘNG LỰC");

      const W = 1080, H = 1920, BEAT = 60 / 130, BAR = BEAT * 4;
      const DROP1 = 2 * BAR, BREAK = 10 * BAR, DROP2 = 11 * BAR, OUTRO = 15 * BAR, END = 30.3;
      const AURA = "#8b5cf6", AURA2 = "#d8ccff", EYE = "#e9f6ff";
      const mk = () => { const c = document.createElement("canvas"); c.width = W; c.height = H; return [c, c.getContext("2d")]; };
      const out = document.getElementById("cv").getContext("2d");
      const [S, s] = mk(), [P, p] = mk(), [F, f] = mk(), [R, r] = mk(), [Y, y] = mk(), [G, gx] = mk();
      const grain = (() => { const c = document.createElement("canvas"); c.width = 540; c.height = 960; const g = c.getContext("2d"), d = g.createImageData(540, 960);
        for (let i = 0; i < 540 * 960; i++) { const v = 128 + (hash(i, 9) - 0.5) * 255; d.data[i * 4] = d.data[i * 4 + 1] = d.data[i * 4 + 2] = v; d.data[i * 4 + 3] = 255; } g.putImageData(d, 0, 0); return c; })();

      // local poses tuned for this edit
      const PP = { ...POSES,
        pushUp: { lean: 64, tilt: -12, aF: [0, 0], aB: [-4, 0], lF: [-64, 0], lB: [-66, 0] },
        pushDown: { lean: 77, tilt: -16, aF: [-70, 128], aB: [-74, 130], lF: [-77, 0], lB: [-79, 0] },
      };

      // ---------- aura figure ----------
      function auraFig(c, o, t, I = 1, eyes = 1) {
        f.clearRect(0, 0, W, H);
        const res = figure(f, { ...o, color: "#000" });
        const sc = o.scale || 1, cx = o.x, cy = o.y - 110 * sc;
        const fl = 0.78 + 0.22 * hash(Math.floor(t * 24), 5);
        c.save(); c.globalCompositeOperation = "lighter"; c.shadowOffsetX = 5000;
        for (const [blur, col, a] of [[140, AURA, 0.6], [64, AURA, 0.85], [22, AURA2, 0.9]]) { c.shadowColor = col; c.shadowBlur = blur * sc; c.globalAlpha = Math.min(1, a * I * fl); c.drawImage(F, -5000, 0); }
        for (let k = 0; k < 3; k++) { // flame tongues rising off the body (scaled copy drawn unscaled, so the shadow lines up)
          const ph = (t * 1.6 + k / 3) % 1, g = 1 + 0.09 * ph * I;
          gx.setTransform(1, 0, 0, 1, 0, 0); gx.clearRect(0, 0, W, H);
          gx.setTransform(g, 0, 0, g, cx * (1 - g), cy * (1 - g) - 70 * sc * ph); gx.drawImage(F, 0, 0); gx.setTransform(1, 0, 0, 1, 0, 0);
          c.shadowColor = AURA; c.shadowBlur = 34 * sc; c.globalAlpha = (1 - ph) * 0.55 * I; c.drawImage(G, -5000, 0);
        }
        // thin bright rim just outside the edge, then the solid black body on top
        c.shadowColor = "#efe9ff"; c.shadowBlur = 4 * sc; c.globalAlpha = 0.8 * Math.min(1, I); c.drawImage(F, -5000, 0);
        c.restore();
        c.drawImage(F, 0, 0);
        if (eyes > 0) {
          const [hx, hy] = res.head, d = o.dir || 1, er = 5.5 * sc;
          c.save(); c.shadowColor = "#7dd3fc"; c.shadowBlur = 26 * sc * eyes; c.fillStyle = EYE; c.globalAlpha = eyes;
          for (const ex of [6, 21]) { c.beginPath(); c.ellipse(hx + d * ex * sc, hy - 5 * sc, er * 1.2, er * 0.75, 0, 0, Math.PI * 2); c.fill(); }
          c.restore();
        }
        return res;
      }
      const ground = (c, yF, col = "#0e0b16") => { c.fillStyle = col; c.fillRect(0, yF, W, H - yF); c.fillStyle = "rgba(139,92,246,0.25)"; c.fillRect(0, yF - 2, W, 3); };
      const sky = (c, a, b) => { const g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, a); g.addColorStop(1, b); c.fillStyle = g; c.fillRect(0, 0, W, H); };
      const pose = (a, b, k) => mixPose(PP[a], PP[b], smooth(k));
      const beatIn = (lt) => lt / BEAT;

      // ---------- shots ----------
      const SHOTS = [];
      const shot = (start, end, draw) => SHOTS.push({ start, end, draw });

      shot(0, 1.2, (c, lt, t) => { c.fillStyle = "#000"; c.fillRect(0, 0, W, H); });
      shot(1.2, 2.77, (c, lt, t) => { // eyes open
        sky(c, "#05040a", "#0c0816");
        const open = smooth((t - 1.6) / 0.25);
        auraFig(c, { x: 540, y: 960 + 640, pose: PP.stand, scale: 4, dir: 1 }, t, 0.15 + 0.5 * open, open);
      });
      shot(2.77, DROP1, (c, lt, t) => { // alarm, fist slam
        sky(c, "#06040c", "#120a20");
        const hit = t >= 3.42, shk = hit ? 0 : Math.sin(t * 80) * 10;
        const sq = hit ? 1 - 0.25 * Math.exp(-(t - 3.42) / 0.08) : 1;
        c.save(); c.translate(540 + shk, 1150); c.scale(1, sq);
        c.fillStyle = "#1b1726"; for (const sx of [-1, 1]) { c.beginPath(); c.arc(sx * 150, -210, 70, 0, Math.PI * 2); c.fill(); }
        c.fillStyle = "#231d33"; c.beginPath(); c.arc(0, 0, 230, 0, Math.PI * 2); c.fill();
        c.strokeStyle = AURA; c.lineWidth = 8; c.stroke();
        c.fillStyle = hit ? "#3b2a5e" : "#ff3d6e"; c.font = "900 130px 'Mont'"; c.textAlign = "center"; c.textBaseline = "middle"; c.fillText("4:59", 0, 10);
        c.restore();
        if (t > 3.25) { const k = smooth((t - 3.25) / 0.17); c.fillStyle = "#000"; c.save(); c.shadowColor = AURA; c.shadowBlur = 40; roundRect(c, 420, lerp(-300, 640, k), 240, 300, 60); c.fill(); c.restore(); }
      });

      const drop1 = [
        (c, lt, t) => { // wake: rise and ignite
          sky(c, "#07050d", "#150c26"); ground(c, 1460);
          c.fillStyle = "#17121f"; c.fillRect(120, 1300, 520, 160); c.fillRect(120, 1220, 60, 240);
          const k = clamp01(beatIn(lt) / 1.2);
          const o = { x: lerp(440, 520, k), y: lerp(1300 - 8, 1460 - 146 * 1.7, k), pose: pose("sit", "stand", k), scale: 1.7, dir: 1 };
          auraFig(c, o, t, 0.4 + 0.8 * smooth(beatIn(lt) / 1.5));
        },
        (c, lt, t) => { // push-ups, down on beats 1 and 3
          sky(c, "#06050c", "#130b22"); ground(c, 1420);
          const b = beatIn(lt), ph = (Math.sin((b - 0.5) * Math.PI) + 1) / 2;
          const scl = 1.9, o = { x: 470, y: 1420 - lerp(64, 33, ph) * scl, pose: mixPose(PP.pushUp, PP.pushDown, ph), scale: scl, dir: 1 };
          auraFig(c, o, t, 1.0);
        },
        (c, lt, t) => { // deadlift, lock out on beat 2
          sky(c, "#07040b", "#170a1f"); ground(c, 1440);
          const k = clamp01((beatIn(lt) - 1) / 1);
          const scl = 1.8, o = { x: 540, y: 1440 - lerp(98, 146, smooth(k)) * scl, pose: pose("squat", "deadTop", k), scale: scl, dir: 1 };
          const res = auraFig(c, o, t, 0.8 + 0.6 * smooth(k));
          const [hx, hy] = res.hands[0];
          c.fillStyle = "#c9c4d6"; c.fillRect(hx - 330, hy - 7, 660, 14);
          for (const sx of [-1, 1]) for (const [dx, r0] of [[0, 110], [34, 90]]) { c.fillStyle = dx ? "#2a2238" : "#1a1524"; c.beginPath(); c.arc(hx + sx * (250 + dx), hy, r0, 0, Math.PI * 2); c.fill(); c.strokeStyle = AURA; c.lineWidth = 4; c.stroke(); }
          if (k >= 1) { const e = (beatIn(lt) - 2) / 1.2; for (let i = 0; i < 26; i++) { const a = hash(i, 4) * Math.PI * 2, d = e * (180 + hash(i, 5) * 260); c.fillStyle = `rgba(216,204,255,${clamp01(1 - e)})`; c.fillRect(hx + Math.cos(a) * d, hy + Math.sin(a) * d - e * e * 60, 5, 5); } }
        },
        (c, lt, t) => { // sprint in the rain under street lights
          sky(c, "#050710", "#0b0a1d"); ground(c, 1500, "#0a0912");
          for (let i = 0; i < 4; i++) { const x = ((i * 420 - lt * 900) % 1680 + 1680) % 1680 - 300; c.fillStyle = "#16131f"; c.fillRect(x, 700, 14, 800); c.fillStyle = "rgba(255,230,190,0.9)"; c.fillRect(x - 40, 690, 90, 12);
            const g = c.createLinearGradient(0, 700, 0, 1500); g.addColorStop(0, "rgba(255,230,190,0.18)"); g.addColorStop(1, "rgba(255,230,190,0.02)"); c.fillStyle = g; c.beginPath(); c.moveTo(x - 30, 702); c.lineTo(x + 60, 702); c.lineTo(x + 230, 1500); c.lineTo(x - 200, 1500); c.closePath(); c.fill(); }
          c.strokeStyle = "rgba(180,190,255,0.35)"; c.lineWidth = 2;
          for (let i = 0; i < 160; i++) { const x = (hash(i, 1) * W - lt * 300) % W, yy = ((hash(i, 2) * H + t * 2200) % H); c.beginPath(); c.moveTo((x + W) % W, yy); c.lineTo((x + W) % W - 10, yy + 46); c.stroke(); }
          for (let i = 0; i < 14; i++) { const yy = 1050 + hash(i, 3) * 420, x = ((hash(i, 4) * 1400 - lt * 2600) % 1400 + 1400) % 1400 - 200; c.fillStyle = "rgba(216,204,255,0.25)"; c.fillRect(x, yy, 160, 4); }
          const ph = (Math.sin(t * 2 * Math.PI * 2.2) + 1) / 2, scl = 1.7;
          auraFig(c, { x: 520, y: 1500 - 140 * scl + Math.abs(Math.cos(t * 2 * Math.PI * 2.2)) * -14, pose: mixPose(PP.sprintA, PP.sprintB, ph), scale: scl, dir: 1 }, t, 1.1);
        },
        (c, lt, t) => { // late-night study, pages flip on the beat
          sky(c, "#06050b", "#110b1c"); ground(c, 1460);
          const lamp = c.createRadialGradient(700, 1050, 10, 700, 1050, 520); lamp.addColorStop(0, "rgba(255,220,160,0.32)"); lamp.addColorStop(1, "rgba(255,220,160,0)"); c.fillStyle = lamp; c.fillRect(0, 500, W, 1000);
          c.fillStyle = "#1b1624"; c.fillRect(520, 1240, 420, 22); c.fillRect(900, 1262, 18, 198); c.fillRect(540, 1262, 18, 198);
          c.fillStyle = "#2a2238"; c.fillRect(840, 1080, 12, 160); c.fillStyle = "rgba(255,220,160,0.95)"; c.beginPath(); c.moveTo(800, 1080); c.lineTo(890, 1080); c.lineTo(860, 1040); c.lineTo(820, 1040); c.fill();
          c.fillStyle = "#e9e3f5"; c.fillRect(600, 1222, 200, 18);
          const fk = beatIn(lt) % 1, pw = 100 * Math.cos(Math.PI * fk); c.fillStyle = "#cfc6e6"; c.fillRect(700, 1206, pw, 16);
          const cl = [880, 640]; c.fillStyle = "#1b1624"; c.beginPath(); c.arc(cl[0], cl[1], 60, 0, 7); c.fill(); c.strokeStyle = AURA; c.lineWidth = 5; c.stroke();
          for (const [len, sp] of [[46, 9], [30, 1.2]]) { const a = t * sp; c.beginPath(); c.moveTo(cl[0], cl[1]); c.lineTo(cl[0] + Math.sin(a) * len, cl[1] - Math.cos(a) * len); c.strokeStyle = "#d8ccff"; c.lineWidth = 6; c.stroke(); }
          c.fillStyle = "#17121f"; c.fillRect(330, 1300, 120, 18); c.fillRect(340, 1318, 14, 142); c.fillRect(426, 1318, 14, 142);
          const scl = 1.7; auraFig(c, { x: 390, y: 1300 - 8 * scl, pose: PP.study, scale: scl, dir: 1 }, t, 0.75);
        },
        (c, lt, t) => { // phone tempts, gets flipped face down on beat 3
          sky(c, "#050409", "#0d0915"); c.fillStyle = "#15111d"; c.fillRect(0, 1300, W, 620);
          const flipped = beatIn(lt) >= 3, fk = smooth((beatIn(lt) - 2.75) / 0.25);
          c.save(); c.translate(540, 980); c.scale(1, lerp(1, -0.15, fk));
          c.fillStyle = "#0b0a10"; roundRect(c, -230, -420, 460, 840, 60); c.fill(); c.strokeStyle = "#2b2438"; c.lineWidth = 10; c.stroke();
          if (!flipped) {
            c.save(); c.shadowColor = "#60a5fa"; c.shadowBlur = 80; c.fillStyle = "#1e2a44"; roundRect(c, -205, -390, 410, 780, 44); c.fill(); c.restore();
            const msgs = ["Đi chơi không?", "Ngủ thêm tí đi", "Lướt tí thôi"];
            msgs.forEach((m, i) => { if (beatIn(lt) < i * 0.8) return; const yy = -300 + i * 180; c.fillStyle = "rgba(235,240,255,0.95)"; roundRect(c, -180, yy, 360, 130, 28); c.fill(); c.fillStyle = "#1b2233"; c.font = "900 34px 'Mont'"; c.textAlign = "left"; c.textBaseline = "middle"; c.fillText(m, -150, yy + 65); });
          }
          c.restore();
          if (beatIn(lt) > 2.4) { const k = smooth((beatIn(lt) - 2.4) / 0.5); c.save(); c.shadowColor = AURA; c.shadowBlur = 50; c.fillStyle = "#000"; roundRect(c, lerp(1100, 560, k), 900, 520, 160, 70); c.fill(); c.restore(); }
        },
        (c, lt, t) => { // they sleep
          sky(c, "#040408", "#0a0a10"); ground(c, 1440, "#09090e");
          c.fillStyle = "#15141c"; c.fillRect(160, 1270, 760, 170); c.fillRect(160, 1180, 760, 100);
          for (const [x, ph] of [[330, 0], [700, 0.5]]) {
            figure(c, { x, y: 1290, pose: mixPose(PP.slumpSit, PP.phone, 0.35), color: "#3a3a46", scale: 1.6, dir: x < 500 ? 1 : -1 });
            const zz = (t * 0.8 + ph) % 1; c.fillStyle = `rgba(200,200,220,${0.6 * (1 - zz)})`; c.font = "900 54px 'Mont'"; c.fillText("z", x + 40, 1000 - zz * 160);
          }
        },
        (c, lt, t) => { // you build: overhead press, max aura
          sky(c, "#0a0514", "#1c0c33"); ground(c, 1460);
          const k = clamp01(beatIn(lt) / 0.8), scl = 1.8;
          const res = auraFig(c, { x: 540, y: 1460 - 146 * scl, pose: pose("hold", "lift", k), scale: scl, dir: 1 }, t, 1.5);
          const [hx, hy] = res.hands[0];
          c.fillStyle = "#c9c4d6"; c.fillRect(hx - 330, hy - 7, 660, 14);
          for (const sx of [-1, 1]) { c.fillStyle = "#1a1524"; c.beginPath(); c.arc(hx + sx * 260, hy, 105, 0, Math.PI * 2); c.fill(); c.strokeStyle = AURA2; c.lineWidth = 5; c.stroke(); }
        },
      ];
      drop1.forEach((d, i) => shot(DROP1 + i * BAR, DROP1 + (i + 1) * BAR, d));

      shot(BREAK, DROP2, (c, lt, t) => { // rooftop at dawn, calm
        const g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, "#05040c"); g.addColorStop(0.62, "#24123f"); g.addColorStop(0.7, "#b4553a"); g.addColorStop(0.72, "#140d1e"); g.addColorStop(1, "#07060b"); c.fillStyle = g; c.fillRect(0, 0, W, H);
        for (let i = 0; i < 14; i++) { const w = 60 + hash(i, 1) * 90, hgt = 120 + hash(i, 2) * 360; c.fillStyle = "#0b0912"; c.fillRect(i * 80 - 20, 1380 - hgt, w, hgt); }
        c.fillStyle = "#0e0b15"; c.fillRect(0, 1380, 700, 540);
        auraFig(c, { x: 600, y: 1380 - 146 * 1.6, pose: PP.stand, scale: 1.6, dir: 1 }, t, 0.45);
      });

      for (let i = 0; i < 3; i++) shot(DROP2 + i * BAR, DROP2 + (i + 1) * BAR, (c, lt, t) => { // walking forward, getting bigger
        sky(c, "#07040e", "#1a0b2e");
        const hz = 1250; c.strokeStyle = "rgba(139,92,246,0.35)"; c.lineWidth = 3;
        for (let k = -8; k <= 8; k++) { c.beginPath(); c.moveTo(540 + k * 40, hz); c.lineTo(540 + k * 400, H); c.stroke(); }
        for (let k = 0; k < 10; k++) { const yy = hz + Math.pow(((k / 10 + t * 0.6) % 1), 2) * (H - hz); c.beginPath(); c.moveTo(0, yy); c.lineTo(W, yy); c.stroke(); }
        const prog = (t - DROP2) / (3 * BAR), scl = lerp(1.6, 3.1, prog);
        const ph = (Math.sin(t * Math.PI * 2 * 1.08) + 1) / 2;
        auraFig(c, { x: 540, y: 1700 - 146 * scl * 0.2, pose: mixPose(PP.walkA, PP.walkB, ph), scale: scl, dir: 1 }, t, 1.4);
        for (let k = 0; k < 40; k++) { const e = (t * 0.5 + hash(k, 7)) % 1; c.fillStyle = `rgba(216,204,255,${0.8 * (1 - e)})`; c.fillRect(hash(k, 8) * W, H - e * H * 0.9, 4, 4); }
      });
      shot(DROP2 + 3 * BAR, OUTRO, (c, lt, t) => { // eyes, max aura
        sky(c, "#0a0515", "#1e0b36");
        auraFig(c, { x: 540, y: 960 + 640 + Math.sin(t * 40) * 3, pose: PP.stand, scale: 4, dir: 1 }, t, 1.6, 1);
      });
      shot(OUTRO, END + 1, (c, lt, t) => { c.fillStyle = "#000"; c.fillRect(0, 0, W, H); const g = c.createRadialGradient(540, 900, 10, 540, 900, 600); g.addColorStop(0, `rgba(139,92,246,${0.35 * (1 - lt / 3)})`); g.addColorStop(1, "rgba(139,92,246,0)"); c.fillStyle = g; c.fillRect(0, 0, W, H); });

      // ---------- text slams ----------
      const TEXT = [
        { t: 0.25, d: 0.95, s: "4:59", size: 220, y: 960, color: "#ff3d6e" },
        ...["DẬY.", "TẬP.", "NÂNG.", "CHẠY.", "HỌC.", "KHÔNG.", "HỌ NGỦ.", "BẠN XÂY."].map((s, i) => ({ t: DROP1 + i * BAR + (i === 5 ? 3 * BEAT : 0.02), d: i === 5 ? BEAT : BAR - 0.05, s, size: 150, y: 420 })),
        { t: BREAK + 0.2, d: BAR - 0.2, s: "không ai thấy những ngày này.", size: 52, y: 1560, type: true },
        { t: DROP2, d: BAR, s: "KỶ LUẬT", size: 170, y: 400 },
        { t: DROP2 + BAR, d: BAR, s: "KHÔNG CẦN", size: 150, y: 400 },
        { t: DROP2 + 2 * BAR, d: BAR, s: "ĐỘNG LỰC.", size: 160, y: 400 },
        { t: DROP2 + 3 * BAR, d: BAR + 3, s: "KỶ LUẬT", size: 190, y: 330 },
        { t: DROP2 + 3 * BAR + BEAT * 2, d: BAR + 3 - BEAT * 2, s: "> ĐỘNG LỰC", size: 120, y: 500, color: "#c4b5fd" },
      ];
      function texts(c, t) {
        for (const x of TEXT) {
          if (t < x.t || t >= x.t + x.d) continue;
          const lt = t - x.t;
          c.save(); c.textAlign = "center"; c.textBaseline = "middle";
          let size = x.size; c.font = `900 ${size}px 'Mont'`; while (c.measureText(x.s).width > 980 && size > 30) { size -= 4; c.font = `900 ${size}px 'Mont'`; }
          if (x.type) { const n = Math.floor(clamp01(lt / 1.2) * [...x.s].length); c.fillStyle = "rgba(233,228,250,0.9)"; c.fillText([...x.s].slice(0, n).join(""), W / 2, x.y); c.restore(); continue; }
          const sl = 1 + 0.9 * Math.exp(-lt / 0.07), rot = (hash(Math.floor(x.t * 10), 2) - 0.5) * 0.08 * Math.exp(-lt / 0.15);
          c.translate(W / 2, x.y); c.rotate(rot); c.scale(sl, sl);
          c.lineJoin = "round"; c.lineWidth = size * 0.14; c.strokeStyle = "#000"; c.strokeText(x.s, 0, 0);
          c.shadowColor = x.color || AURA; c.shadowBlur = 40; c.fillStyle = x.color ? x.color : "#ffffff"; c.fillText(x.s, 0, 0);
          c.restore();
        }
      }

      // ---------- post: camera punch, shake, RGB split, flash, grain ----------
      const inDrop = (t) => (t >= DROP1 && t < BREAK) || (t >= DROP2 && t < OUTRO);
