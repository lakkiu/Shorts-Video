<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/lib/gsap.min.js"></script>
    <style>
      @font-face { font-family: "JB Mono"; font-weight: 800; src: url("assets/fonts/jetbrains-mono-latin-800-normal.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+2122, U+2212, U+FEFF; }
      @font-face { font-family: "JB Mono"; font-weight: 800; src: url("assets/fonts/jetbrains-mono-vietnamese-800-normal.woff2") format("woff2");
        unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; background: #000; }
      #cv { position: absolute; inset: 0; width: 1080px; height: 1920px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="52.5" data-width="1080" data-height="1920">
      <canvas id="cv" class="clip" data-start="0" data-duration="52.5" data-track-index="0" width="1080" height="1920"></canvas>
      <audio id="music" class="clip" src="assets/audio/phonk.mp3" data-start="0" data-duration="52.5" data-track-index="1" data-volume="0.9"></audio>
      <audio id="sfx" class="clip" src="assets/audio/sfx.mp3" data-start="0" data-duration="52.5" data-track-index="2" data-volume="0.8"></audio>
    </div>

    <script>
      (function () {
        var D = 52.5, clock = { t: 0 }, sc = { render: null };
        window.__mono = sc;
        window.__hf = window.__hf || {};
        window.__hf.buildReady = window.__hf.buildReady || {};
        window.__hf.buildReady["main"] = new Promise(function (r) { sc.ready = r; });
        var tl = gsap.timeline({ paused: true });
        tl.to(clock, { t: D, duration: D, ease: "none", onUpdate: function () { if (sc.render) sc.render(clock.t); } }, 0);
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      })();
    </script>

    <script type="module">
      import { C, POSES, trackAt, figure, brick, stool, clock, bulb, room, reflect, smooth, lerp, clamp01, mixHex, hash, roundRect } from "./assets/mono.js";
      const T = await (await fetch("timing.json")).json();
      await document.fonts.load("800 50px 'JB Mono'", "KỶ LUẬT NGÀY");

      const W = 1080, H = 1920, FLOOR = 1320, BAR = 1.875, BEAT = 0.46875;
      const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
      const off = document.createElement("canvas"); off.width = W; off.height = H; const o = off.getContext("2d");

      // ---- layout ----
      const STEP_W = 52, STEP_H = 54, stepX = (i) => 440 + i * STEP_W, stepTop = (i) => FLOOR - (i + 1) * STEP_H;
      const LEDGE = { x: 948, y: stepTop(9), w: 132 }, DOOR = { x: 976, y: stepTop(9) - 190, w: 88, h: 190 };
      const SEAT = FLOOR - 96, SIT_Y = SEAT - 6, STAND_Y = FLOOR - 146;
      const W_X = 360;

      // ---- brick schedule ----
      const wb = T.wBricks.map((b) => b.bar != null
        ? { i: b.i, drop: b.bar * BAR - 0.4, catch: b.bar * BAR, thr: b.bar * BAR + 0.94, land: b.bar * BAR + 1.406 } : b);
      const gb = [{ drop: T.gBricks.first[0], land: T.gBricks.first[1] }];
      for (let b = T.gBricks.bars[0]; b <= T.gBricks.bars[1]; b++) gb.push({ drop: b * BAR + 0.1, land: b * BAR + 0.469 });
      const pileSlot = (() => { const s = []; const rows = [4, 4, 3, 2, 1]; rows.forEach((n, r) => { for (let k = 0; k < n; k++) s.push([212 + r * 22 + k * 46, FLOOR - 15 - r * 28]); }); return s; })();

      // ---- tracks ----
      const wTrack = [
        { t: 0, pose: "slumpSit", x: 330, y: SIT_Y, dir: 1 },
        { t: 3.05, pose: "stand", x: W_X, y: STAND_Y, move: 0.35, blend: 0.3 },
      ];
      for (const b of wb) {
        if (b.i === 8) { wTrack.push({ t: 20.7, pose: "slump", x: W_X, y: STAND_Y + 6, blend: 0.5 }, { t: 21.85, pose: "stand", x: W_X, y: STAND_Y, blend: 0.3 }); }
        wTrack.push({ t: b.catch - 0.05, pose: "hold", x: W_X, y: STAND_Y }, { t: b.thr - 0.05, pose: "throw", x: W_X, y: STAND_Y, blend: 0.12 }, { t: b.land, pose: "stand", x: W_X, y: STAND_Y, blend: 0.3 });
      }
      const C0 = T.climb;
      wTrack.push({ t: C0.approach, pose: "walk", x: stepX(0) - 6, y: STAND_Y, move: 0.8 });
      for (let i = 0; i < 10; i++) wTrack.push({ t: C0.firstStep + i * C0.perStep, pose: "walk", x: stepX(i) + STEP_W / 2, y: stepTop(i) - 146, move: C0.perStep });
      const atTop = C0.firstStep + 10 * C0.perStep;
      wTrack.push({ t: atTop, pose: "walk", x: DOOR.x + 22, y: LEDGE.y - 146, move: 0.9 });
      wTrack.push({ t: atTop + 1.0, pose: "stand", x: DOOR.x + 22, y: LEDGE.y - 146 });
      wTrack.push({ t: 31.9, pose: "reach", x: DOOR.x + 22, y: LEDGE.y - 146, blend: 0.4 });
      wTrack.push({ t: T.doorOpen + 0.35, pose: "victory", x: DOOR.x + 30, y: LEDGE.y - 146, blend: 0.3, move: 0.3 });

      const gTrack = [
        { t: 0, pose: "phone", x: 150, y: SIT_Y, dir: 1 },
        { t: T.phoneOff, pose: "sit", x: 150, y: SIT_Y, blend: 0.4 },
        { t: T.gStand, pose: "stand", x: 168, y: STAND_Y, move: 0.35 },
        { t: T.gLookUp, pose: "lookUp", x: 168, y: STAND_Y, blend: 0.5 },
        { t: T.gWalk, pose: "walk", x: 200, y: STAND_Y, move: 0.5, then: "stand" },
        { t: T.gLift, pose: "lift", x: 200, y: STAND_Y, dir: 1, blend: 0.3 },
        { t: T.gThrow, pose: "throw", x: 196, y: STAND_Y, dir: -1, blend: 0.15 },
        { t: T.gLand + 0.15, pose: "stand", x: 196, y: STAND_Y, dir: -1, blend: 0.3 },
        { t: T.gDay1 + 0.6, pose: "lookUp", x: 196, y: STAND_Y, dir: 1, blend: 0.6 },
      ];

      const counterValue = (t) => {
        if (t >= T.gDay1) return 1;
        const bar = Math.floor(t / BAR), c = T.counter;
        if (bar < c.firstBar) return 1;
        return c.bars[Math.min(c.bars.length - 1, bar - c.firstBar)];
      };
      const clockMinutes = (t) => (t < 1.5 ? 298 + (t / 1.5) * 2 : t < 7.5 ? 300 + (t - 1.5) * 2 : 312 + (t - 7.5) * (720 / BAR) * Math.min(1, Math.max(0.05, (33.75 - t) / 26)));

      function drawSteps(c, t) {
        for (const b of wb) {
          if (t < b.land) continue;
          const x = stepX(b.i), top = stepTop(b.i), fresh = clamp01(1 - (t - b.land) / 0.6);
          const g = c.createLinearGradient(0, top, 0, FLOOR);
          g.addColorStop(0, mixHex("#c98a24", "#ffd27a", fresh)); g.addColorStop(1, "#5a3c12");
          c.fillStyle = g; c.fillRect(x, top, STEP_W - 2, FLOOR - top);
          c.fillStyle = "rgba(0,0,0,0.28)"; for (let y = top + 27; y < FLOOR; y += 27) c.fillRect(x, y, STEP_W - 2, 3);
          c.fillStyle = mixHex("#ffcf6a", "#fff3d6", fresh); c.fillRect(x, top, STEP_W - 2, 6);
          if (fresh > 0) { c.save(); c.shadowColor = C.accent; c.shadowBlur = 40 * fresh; c.fillStyle = `rgba(255,200,90,${0.35 * fresh})`; c.fillRect(x, top, STEP_W - 2, 30); c.restore(); }
        }
      }
      function dust(c, x, y, t0, t) {
        const k = (t - t0) / 0.45; if (k < 0 || k > 1) return;
        for (let i = 0; i < 10; i++) { const a = (i / 10) * Math.PI; c.fillStyle = `rgba(255,220,160,${0.5 * (1 - k)})`; c.beginPath(); c.arc(x + Math.cos(a) * 60 * k * (i % 2 ? 1 : -1), y - Math.sin(a) * 30 * k, 4 * (1 - k) + 1, 0, 7); c.fill(); }
      }

      function scene(c, t) {
        room(c, W, FLOOR, H);
        const struggle = t >= T.struggle[0] && t < T.struggle[1];
        const bulbI = struggle ? 0.3 + 0.2 * (hash(Math.floor(t * 9), 3) > 0.6 ? 1 : 0) : t >= T.doorOpen ? 0.55 : 1;
        bulb(c, 560, 470, bulbI, FLOOR, W);
        // wall clock (shakes while ringing)
        const ring = t >= T.alarm[0] && t < T.alarm[1];
        const sh = ring ? Math.sin(t * 70) * 5 : 0;
        clock(c, 250 + sh, 560, 50, clockMinutes(t));
        if (ring && Math.floor(t * 8) % 2 === 0) { c.strokeStyle = C.accent; c.lineWidth = 5; for (const s of [-1, 1]) { c.beginPath(); c.arc(250, 560, 72, s > 0 ? -0.6 : Math.PI - 0.4, s > 0 ? 0.4 : Math.PI + 0.6); c.stroke(); } }
        // ledge + door
        c.fillStyle = "#232a35"; c.fillRect(LEDGE.x, LEDGE.y, LEDGE.w, 26);
        const open = smooth((t - T.doorOpen) / 0.5);
        c.fillStyle = "#1a2029"; c.fillRect(DOOR.x - 8, DOOR.y - 8, DOOR.w + 16, DOOR.h + 8);
        if (open > 0) {
          c.save(); c.shadowColor = C.light; c.shadowBlur = 90 * open; c.fillStyle = C.light; c.fillRect(DOOR.x, DOOR.y, DOOR.w, DOOR.h); c.restore();
          const beam = c.createLinearGradient(DOOR.x, DOOR.y, 120, FLOOR);
          beam.addColorStop(0, `rgba(255,243,214,${0.32 * open})`); beam.addColorStop(1, `rgba(255,243,214,${0.06 * open})`);
          c.fillStyle = beam; c.beginPath(); c.moveTo(DOOR.x, DOOR.y); c.lineTo(DOOR.x, LEDGE.y); c.lineTo(560, FLOOR); c.lineTo(-120, FLOOR); c.closePath(); c.fill();
          const pool = c.createRadialGradient(230, FLOOR, 10, 230, FLOOR, 330);
          pool.addColorStop(0, `rgba(255,243,214,${0.28 * smooth((t - T.doorOpen - 0.8) / 2)})`); pool.addColorStop(1, "rgba(255,243,214,0)");
          c.fillStyle = pool; c.fillRect(-100, FLOOR - 330, 660, 340);
        }
        c.fillStyle = open > 0 ? "#2b323d" : "#262d38"; c.fillRect(DOOR.x, DOOR.y, DOOR.w * (1 - 0.86 * open), DOOR.h);
        c.fillStyle = "#c9a24a"; c.beginPath(); c.arc(DOOR.x + DOOR.w * (1 - 0.86 * open) - 14, DOOR.y + DOOR.h * 0.52, 5, 0, 7); c.fill();
        // stools
        stool(c, 150, FLOOR); if (t < 3.4) stool(c, 330, FLOOR);
        // staircase
        drawSteps(c, t);
        for (const b of wb) dust(c, stepX(b.i) + STEP_W / 2, stepTop(b.i), b.land, t);
        // G's pile: bricks dim from amber to grey as they wait unused
        const gTaken = t >= T.gLift ? 1 : 0;
        gb.forEach((b, k) => {
          if (t < b.drop) return;
          if (gTaken && k === gb.length - 1) return;
          const [px, py] = pileSlot[k];
          const y = t < b.land ? lerp(-60, py, Math.pow(clamp01((t - b.drop) / (b.land - b.drop)), 2)) : py;
          const age = clamp01((t - b.land) / 5);
          const lit = t > T.doorOpen + 1 ? smooth((t - T.doorOpen - 1) / 2) * 0.6 : 0;
          brick(c, px, y, { w: 44, h: 26, color: mixHex(C.accent, "#3a3f48", Math.max(0, age - lit)), glow: Math.max(0, 1 - age) * 0.8 + lit * 0.6 });
        });
        // G's own first step
        if (t >= T.gLand) {
          const fresh = clamp01(1 - (t - T.gLand) / 0.8);
          c.save(); c.shadowColor = C.accent; c.shadowBlur = 30 + 30 * fresh; c.fillStyle = mixHex("#c98a24", "#ffd27a", fresh); c.fillRect(44, stepTop(0), STEP_W - 2, STEP_H); c.restore();
          c.fillStyle = "#ffcf6a"; c.fillRect(44, stepTop(0), STEP_W - 2, 6);
          dust(c, 70, stepTop(0), T.gLand, t);
        }
        // figures
        const g = trackAt(gTrack, t), w = trackAt(wTrack, t);
        const gHands = figure(c, { ...g, color: C.gray });
        const wGlow = t >= T.doorOpen ? 0 : 0;
        const wHands = figure(c, { ...w, color: t >= T.doorOpen ? "#d8d5cc" : C.white, glow: wGlow });
        // W's bricks in flight / in hand
        for (const b of wb) {
          const [hx, hy] = wHands.hands[0];
          if (t >= b.drop && t < b.catch) { const k = Math.pow(clamp01((t - b.drop) / (b.catch - b.drop)), 2); brick(c, hx, lerp(-60, hy - 18, k)); }
          else if (t >= b.catch && t < b.thr) brick(c, hx, hy - 18);
          else if (t >= b.thr && t < b.land) {
            const k = (t - b.thr) / (b.land - b.thr), tx = stepX(b.i) + STEP_W / 2, ty = stepTop(b.i) + 20;
            brick(c, lerp(hx, tx, k), lerp(hy - 18, ty, k) - Math.sin(Math.PI * k) * 200, { rot: k * Math.PI * 1.5 });
          }
        }
        // G's brick
        if (t >= T.gLift && t < T.gThrow) { const [hx, hy] = gHands.hands[0]; brick(c, hx, hy - 16, { w: 52, h: 32, color: C.accent }); }
        if (t >= T.gThrow && t < T.gLand) {
          const k = (t - T.gThrow) / (T.gLand - T.gThrow); const [hx, hy] = gHands.hands[0];
          brick(c, lerp(hx, 70, k), lerp(hy - 16, stepTop(0) + 26, k) - Math.sin(Math.PI * k) * 160, { w: 52, h: 32, rot: -k * Math.PI });
        }
        return struggle;
      }

      function text(c, t) {
        const v = counterValue(t), gold = t >= T.gDay1;
        const bump = (() => { const bar = Math.floor(t / BAR); const k = (t - bar * BAR) / 0.25; return bar >= T.counter.firstBar && bar <= 16 && k < 1 ? 1 + 0.12 * (1 - k) : t >= T.gDay1 && t < T.gDay1 + 0.3 ? 1.25 - (t - T.gDay1) : 1; })();
        c.save(); c.translate(W / 2, 180); c.scale(bump, bump);
        c.font = "800 46px 'JB Mono'"; c.textAlign = "center"; c.letterSpacing = "6px";
        c.fillStyle = gold ? C.accent : "rgba(241,239,232,0.82)"; c.fillText(`NGÀY ${v}`, 0, 0);
        c.restore();
        const lines = [["KỶ LUẬT LÀ ĐẶT MỘT VIÊN GẠCH,", 50, 290, C.white], ["KỂ CẢ HÔM KHÔNG MUỐN.", 50, 362, C.white], ["HÔM NAY LÀ NGÀY 1 CỦA BẠN.", 38, 420, C.accent]];
        lines.forEach(([s, size, y, col], i) => {
          const [st, d] = T.text[i]; if (t < st) return;
          const n = Math.floor(clamp01((t - st) / d) * [...s].length);
          c.font = `800 ${size}px 'JB Mono'`; c.textAlign = "center"; c.letterSpacing = "2px"; c.fillStyle = col;
          c.fillText([...s].slice(0, n).join("") + (t - st < d + 0.6 && Math.floor(t * 3) % 2 ? "▍" : ""), W / 2, y);
        });
      }

      function render(t) {
        o.clearRect(0, 0, W, H);
        const struggle = scene(o, t);
        ctx.clearRect(0, 0, W, H);
        ctx.drawImage(off, 0, 0);
        reflect(ctx, off, FLOOR, W, H, 0.2);
        if (struggle) { ctx.fillStyle = "rgba(0,0,0,0.35)"; ctx.fillRect(0, 0, W, H); }
        const flash = t >= T.doorOpen && t < T.doorOpen + 0.35 ? 1 - (t - T.doorOpen) / 0.35 : 0;
        if (flash) { ctx.fillStyle = `rgba(255,243,214,${0.85 * flash})`; ctx.fillRect(0, 0, W, H); }
        const vg = ctx.createRadialGradient(W / 2, H * 0.45, H * 0.25, W / 2, H * 0.45, H * 0.75);
        vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,0.55)");
        ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
        text(ctx, t);
      }

      window.__mono.render = render;
      window.addEventListener("hf-seek", (e) => render(e.detail.time));
      render(0);
      window.__mono.ready();
      document.title = "done";
    </script>
  </body>
</html>
