<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/lib/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Jua";
        src: url("assets/fonts/jua-korean.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #cfe3f5; }
      #root { width: 100%; height: 100%; position: relative; }
      #gl { position: absolute; inset: 0; width: 1080px; height: 1920px; }
      .cap {
        position: absolute; left: 0; right: 0; top: 1470px; text-align: center;
        font-family: "Montserrat"; font-weight: 900; font-size: 92px; color: #ffffff;
        -webkit-text-stroke: 14px #141626; paint-order: stroke fill; letter-spacing: -0.01em;
      }
      .cap span { display: inline-block; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1080" data-height="1920">
      <canvas id="gl" class="clip" data-start="0" data-duration="6" data-track-index="0" width="1080" height="1920"></canvas>
      <div id="cap1" class="cap clip" data-start="1.86" data-duration="0.64" data-track-index="1"><span>Ngày đầu tiên</span></div>
      <div id="cap2" class="cap clip" data-start="2.5" data-duration="0.8" data-track-index="1"><span>ở Seoul…</span></div>
      <div id="cap3" class="cap clip" data-start="3.3" data-duration="2.6" data-track-index="1"><span>Oa, đẹp quá!</span></div>
      <audio id="vo-linh" class="clip" src="assets/vo/linh.mp3" data-start="1.75" data-track-index="2" data-volume="1"></audio>
    </div>

    <script>
      (function () {
        var clock = { t: 0 };
        var scene = { render: null };
        window.__toon = scene;
        window.__hf = window.__hf || {};
        window.__hf.buildReady = window.__hf.buildReady || {};
        window.__hf.buildReady["main"] = new Promise(function (resolve) { scene.ready = resolve; });
        var tl = gsap.timeline({ paused: true });
        tl.to(clock, { t: 6, duration: 6, ease: "none", onUpdate: function () { if (scene.render) scene.render(clock.t); } }, 0);
        ["#cap1 span", "#cap2 span", "#cap3 span"].forEach(function (s, i) {
          tl.fromTo(s, { scale: 0.6 }, { scale: 1, duration: 0.18, ease: "back.out(3)" }, [1.86, 2.5, 3.3][i]);
        });
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      })();
    </script>

    <script type="module">
      import * as THREE from "./assets/lib/three.module.min.js";
      import { buildWorld, makePetals, HORIZON } from "./assets/toon/world.js";
      import { makePost } from "./assets/toon/post.js";
      import { CAST, POSE, drawCharacter, blinking } from "./assets/toon/characters.js";

      const W = 1080, H = 1920;
      const ease = (x) => { x = Math.min(1, Math.max(0, x)); return x * x * x * (x * (x * 6 - 15) + 10); };
      const lerp = (a, b, k) => a + (b - a) * k;

      await document.fonts.load("92px Jua", "카페");

      const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("gl"), antialias: false, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(W, H, false);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;

      const scene = new THREE.Scene();
      scene.fog = new THREE.Fog(HORIZON, 35, 170);
      const camera = new THREE.PerspectiveCamera(46, W / H, 0.1, 1000);

      // light: warm key from upper right, cool sky fill
      const sun = new THREE.DirectionalLight("#fff1d6", 2.2);
      sun.position.set(18, 30, 14);
      sun.castShadow = true;
      sun.shadow.mapSize.set(2048, 2048);
      Object.assign(sun.shadow.camera, { left: -25, right: 25, top: 25, bottom: -40, near: 1, far: 120 });
      sun.shadow.bias = -0.0008;
      sun.target.position.set(0, 0, -10);
      scene.add(sun, sun.target);
      scene.add(new THREE.HemisphereLight("#cfe0ff", "#e0cfb0", 1.7));

      buildWorld(scene);
      const petals = makePetals(scene);

      // character cards
      const cards = {};
      const shadowTex = (() => {
        const c = document.createElement("canvas"); c.width = c.height = 128;
        const g = c.getContext("2d"); const gr = g.createRadialGradient(64, 64, 4, 64, 64, 62);
        gr.addColorStop(0, "rgba(20,22,38,0.55)"); gr.addColorStop(1, "rgba(20,22,38,0)");
        g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
        return new THREE.CanvasTexture(c);
      })();
      function makeCard(key, height, x, z) {
        const cv = document.createElement("canvas"); cv.width = 600; cv.height = 1000;
        const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4;
        const geo = new THREE.PlaneGeometry(height * 0.6, height);
        geo.translate(0, height / 2 - height * 0.025, 0);
        const mat = new THREE.MeshBasicMaterial({ map: tex, alphaTest: 0.5, color: new THREE.Color(0.97, 0.97, 0.97) });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.userData.flagMat = new THREE.ShaderMaterial({
          uniforms: { map: { value: tex } },
          vertexShader: "varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }",
          fragmentShader: "uniform sampler2D map; varying vec2 vUv; void main(){ if (texture2D(map, vUv).a < 0.5) discard; gl_FragColor = vec4(0.5,0.5,1.0,0.0); }",
        });
        mesh.position.set(x, 0.18, z);
        scene.add(mesh);
        const sh = new THREE.Mesh(new THREE.PlaneGeometry(height * 0.42, height * 0.16),
          new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false }));
        sh.rotation.x = -Math.PI / 2; sh.userData.noNormal = true;
        scene.add(sh);
        cards[key] = { cv, ctx: cv.getContext("2d"), tex, mesh, sh };
      }
      makeCard("linh", 1.55, -0.9, 0);
      makeCard("minh", 1.6, 0.8, -0.9);
      makeCard("kim", 1.55, -3.0, -9);

      function placeCard(key, pose, x, z, t) {
        const c = cards[key];
        drawCharacter(c.ctx, CAST[key], pose, t);
        c.tex.needsUpdate = true;
        c.mesh.position.x = x; c.mesh.position.z = z;
        c.mesh.rotation.y = Math.atan2(camera.position.x - x, camera.position.z - z);
        c.sh.position.set(x, 0.19, z);
      }

      const post = makePost(renderer, W, H);

      function render(t) {
        // camera: low glide in, slight drift right
        const k = ease(t / 6);
        camera.position.set(lerp(0.7, 0.1, k), lerp(1.05, 0.95, k), lerp(5.6, 4.3, k));
        camera.lookAt(lerp(-0.2, -0.4, k), lerp(1.75, 1.6, k), -8);
        camera.rotateZ(THREE.MathUtils.degToRad(lerp(1.5, -1.0, k)));
        camera.updateMatrixWorld();

        // Linh walks toward camera, stops, wow at 3.3
        const walkK = ease(Math.min(1, t / 3.0));
        const lz = lerp(-2.6, 0.4, walkK);
        const moving = t < 2.9 ? 1 : Math.max(0, 1 - (t - 2.9) / 0.25);
        const wow = t >= 3.3;
        const wowK = ease((t - 3.3) / 0.35);
        placeCard("linh", {
          ...POSE, walk: t * 1.1, moving,
          armL: wow ? lerp(20, 130, wowK) : 15 + Math.sin(t * 6.9) * 18 * moving,
          armR: wow ? lerp(-10, 130, wowK) : -15 - Math.sin(t * 6.9) * 18 * moving,
          elbowL: wow ? -40 * wowK : 0, elbowR: wow ? 40 * wowK : 0,
          eyes: wow ? "wow" : blinking([1.4], t) ? "closed" : "open",
          mouth: wow ? "open" : t > 2.9 ? "o" : "smile",
          bob: wow ? Math.max(0, Math.sin((t - 3.3) * Math.PI / 0.4)) * 40 * (t < 3.7 ? 1 : 0) : 0,
          look: t > 2.9 ? -0.6 : 0.3, tilt: wow ? -4 : 0,
        }, -0.55, lz, t);

        // Minh waves from 1.0 s
        const waving = t > 1.0;
        placeCard("minh", {
          ...POSE,
          armR: waving ? 150 : -12, elbowR: waving ? 20 + Math.sin(t * 9) * 22 : 0,
          eyes: t > 3.4 ? "happy" : blinking([0.7, 2.6, 5.1], t) ? "closed" : "open",
          mouth: waving ? "open" : "smile", look: -0.7, tilt: Math.sin(t * 2) * 3,
          bob: Math.abs(Math.sin(t * 3)) * 6,
        }, 0.8, -0.9, t);

        // teacher idles at the far end
        placeCard("kim", {
          ...POSE, armR: 40, elbowR: 70, armL: 12,
          eyes: blinking([1.1, 3.9], t) ? "closed" : "open",
          tilt: -5 + Math.sin(t * 1.5) * 2, bob: Math.sin(t * 2.2) * 4, look: 0.4,
        }, -3.0, -9, t);

        petals.userData.update(t);
        const focus = camera.position.distanceTo(cards.linh.mesh.position) - 0.3;
        post.render(scene, camera, cards, focus);
      }

      window.__toon.render = render;
      window.addEventListener("hf-seek", (e) => render(e.detail.time));
      render(0);
      window.__toon.ready();
      document.title = "done";
    </script>
  </body>
</html>
